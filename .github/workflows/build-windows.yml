name: Build Windows Video Editor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        components: rust-src
        
    - name: Install FFmpeg (Windows)
      run: |
        # Download and install FFmpeg
        Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/6.0/ffmpeg-6.0-full_build.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg"
        # Add FFmpeg to PATH for current job
        echo "${{ github.workspace }}/ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append
        
    - name: Install Windows Build Tools
      run: |
        choco install visualstudio2022buildtools -y --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows10SDK"
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build Release
      run: |
        cargo build --release --target x86_64-pc-windows-msvc
        # Copy required DLLs
        Copy-Item "ffmpeg/ffmpeg-6.0-full_build/bin/*.dll" "target/x86_64-pc-windows-msvc/release/"
        
    - name: Create Installer (Optional - using WiX)
      if: success()
      run: |
        choco install wixtoolset -y
        # Create WiX XML for installer
        @"
        <?xml version="1.0" encoding="UTF-8"?>
        <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
          <Product Id="*" Name="Video Editor" Language="1033" Version="1.0.0.0" Manufacturer="YourCompany" UpgradeCode="YOUR-GUID-HERE">
            <Package InstallerVersion="200" Compressed="yes" InstallScope="perMachine" />
            
            <MajorUpgrade DowngradeErrorMessage="A newer version is already installed." />
            <MediaTemplate />
            
            <Feature Id="ProductFeature" Title="Video Editor" Level="1">
              <ComponentRef Id="ApplicationFiles" />
            </Feature>
            
            <Directory Id="TARGETDIR" Name="SourceDir">
              <Directory Id="ProgramFilesFolder">
                <Directory Id="INSTALLFOLDER" Name="Video Editor" />
              </Directory>
            </Directory>
            
            <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">
              <Component Id="MainExecutable" Guid="*">
                <File Id="VideoEditor.exe" Source="target/x86_64-pc-windows-msvc/release/video_editor.exe" KeyPath="yes" />
                <File Id="ffmpeg.dll" Source="ffmpeg/ffmpeg-6.0-full_build/bin/avcodec-60.dll" />
                <File Id="ffmpeg2.dll" Source="ffmpeg/ffmpeg-6.0-full_build/bin/avformat-60.dll" />
                <File Id="ffmpeg3.dll" Source="ffmpeg/ffmpeg-6.0-full_build/bin/avutil-58.dll" />
                <File Id="ffmpeg4.dll" Source="ffmpeg/ffmpeg-6.0-full_build/bin/swscale-7.dll" />
              </Component>
            </ComponentGroup>
          </Product>
        </Wix>
        "@ | Out-File -FilePath "installer.wxs"
        
        # Build installer (optional)
        # candle.exe installer.wxs
        # light.exe installer.wixobj
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: VideoEditor-Windows
        path: |
          target/x86_64-pc-windows-msvc/release/video_editor.exe
          target/x86_64-pc-windows-msvc/release/*.dll
        retention-days: 7
