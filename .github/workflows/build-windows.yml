name: Build Windows Video Editor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-windows:
    runs-on: windows-latest
    
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: x86_64-pc-windows-msvc
        
    - name: Install FFmpeg (Windows)
      run: |
        # Download and install FFmpeg
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg" -Force
        
        # Add FFmpeg to PATH for current job
        $ffmpegPath = "${{ github.workspace }}/ffmpeg/ffmpeg-master-latest-win64-gpl/bin"
        echo "$ffmpegPath" | Out-File -FilePath $env:GITHUB_PATH -Append
        
        # Verify FFmpeg installation
        & "$ffmpegPath/ffmpeg.exe" -version
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Build Release
      run: |
        # Update Cargo.toml to use dynamic linking for Windows
        (Get-Content Cargo.toml) -replace 'dioxus = .*', 'dioxus = { version = "0.5", features = ["desktop", "macros"] }' | Set-Content Cargo.toml
        
        cargo build --release --target x86_64-pc-windows-msvc
        
        # Test if executable was created
        if (Test-Path "target/x86_64-pc-windows-msvc/release/video_editor.exe") {
          echo "Build successful!"
        } else {
          echo "Build failed - executable not found"
          Get-ChildItem -Recurse "target" | Select-Object Name
          exit 1
        }
        
    - name: Collect DLLs and Assets
      run: |
        # Create distribution folder
        mkdir dist
        mkdir dist\assets
        
        # Copy executable
        Copy-Item "target/x86_64-pc-windows-msvc/release/video_editor.exe" "dist/"
        
        # Copy FFmpeg DLLs
        Copy-Item "ffmpeg/ffmpeg-master-latest-win64-gpl/bin/*.dll" "dist/" -ErrorAction SilentlyContinue
        
        # Create basic assets structure
        echo '{"app": "video_editor", "version": "1.0.0"}' | Out-File -FilePath "dist/config.json" -Encoding UTF8
        
        # Create README
        @"
        Video Editor for Windows
        ========================
        
        To run:
        1. Double-click video_editor.exe
        2. Or run from command line: video_editor.exe
        
        Requirements:
        - Windows 10 or later
        - Visual C++ Redistributable 2019+
        
        If you get DLL errors, install:
        https://aka.ms/vs/17/release/vc_redist.x64.exe
        "@ | Out-File -FilePath "dist/README.txt" -Encoding UTF8
        
    - name: Create ZIP Archive
      run: |
        # Create ZIP using PowerShell (built-in on Windows Server 2022)
        Compress-Archive -Path "dist/*" -DestinationPath "VideoEditor-Windows.zip" -Force
        
    - name: Upload Artifacts (Using v4)
      uses: actions/upload-artifact@v4
      with:
        name: VideoEditor-Windows
        path: |
          VideoEditor-Windows.zip
          target/x86_64-pc-windows-msvc/release/video_editor.exe
        retention-days: 7
        if-no-files-found: error
        
    - name: Upload Release Asset (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: VideoEditor-${{ github.ref_name }}
        path: VideoEditor-Windows.zip
        retention-days: 90
