[package]
name = "video_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.2", features = ["desktop"] }
dioxus-desktop = "0.7.2"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
parking_lot = { version = "0.12", features = ["serde"] }
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
anyhow = "1.0"
thiserror = "1.0"
image = { version = "0.24", features = ["jpeg", "png"] }
rodio = { version = "0.17", features = ["mp3", "flac", "wav", "vorbis"] }
hound = "3.5"
atomic_refcell = "0.1"
glam = "0.24"
chrono = "0.4"
rfd = "0.14"
tempfile = "3.8"
async-trait = "0.1"
once_cell = "1.19"
log = "0.4"
env_logger = "0.10"
crossbeam-channel = "0.5"

# Video processing (optional for basic build)
# ffmpeg-next = { version = "6.0", optional = true }

[features]
default = []
full = ["ffmpeg-next"]

[build-dependencies]
dioxus-cli = "0.7.2"
